<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Navigation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="#home" class="nav-link" aria-describedby="tooltip-home">Home</a>
                    <span class="tooltip" role="tooltip">Go to Home</span>
                </li>
                <li>
                    <a href="#projects" class="nav-link" aria-describedby="tooltip-projects">Projects</a>
                    <span class="tooltip" role="tooltip">View Projects</span>
                </li>
                <li>
                    <a href="#blog" class="nav-link" aria-describedby="tooltip-blog">Blog</a>
                    <span class="tooltip"  role="tooltip">Read Blog</span>
                </li>
                <li>
                    <a href="#contact" class="nav-link" aria-describedby="tooltip-contact">Contact</a>
                    <span class="tooltip" role="tooltip">Contact Us</span>
                </li>
            </ul>
        </nav>
    </header>
</body>
</html>
